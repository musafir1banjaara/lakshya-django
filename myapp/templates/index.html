<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LakshyaIn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .job-card {
            transition: box-shadow 150ms ease, transform 150ms ease;
        }

        .job-card:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <span class="text-xl font-bold text-slate-900 flex items-center gap-2">
                <span class="material-icons-outlined text-indigo-600">work</span>
                LakshyaIn
            </span>
            <button id="addJobBtn"
                class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors flex items-center gap-1.5">
                <span class="material-icons-outlined text-sm leading-none">add</span>
                Add Job
            </button>
        </div>
    </header>

    <section class="max-w-6xl mx-auto px-6 py-14 text-center">
        <h1 class="text-3xl sm:text-4xl font-bold text-slate-900">Discover Opportunities</h1>
        <p class="mt-2 text-slate-500">Explore jobs from top companies.</p>
    </section>

    <main class="max-w-6xl mx-auto px-6 pb-16">
        <div id="jobsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>

        <div id="emptyState" class="hidden text-center py-16">
            <p class="text-slate-500">No jobs posted yet. Click "Add Job" to get started.</p>
        </div>
    </main>
    <ul>
        {% for job in jobs %}
        <li>{{job}}</li>
        {% endfor %}
    </ul>

</body>

</html>
